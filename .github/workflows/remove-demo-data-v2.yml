name: Remove Remaining Demo Data

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Strip hardcoded frontend seed arrays
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          root = Path('frontend/src')
          changed = []
          for path in root.rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              original = text
              matches = list(re.finditer(r'(?m)^const\s+(DEFAULT_[A-Z0-9_]+)(?:\s*:\s*[^=]+)?\s*=\s*\[', text))
              for m in reversed(matches):
                  name = m.group(1)
                  start = m.start()
                  end_match = re.search(r'(?m)^\];\s*', text[m.end():])
                  if not end_match:
                      continue
                  end = m.end() + end_match.end()
                  text = text[:start] + text[end:]
              names = set(re.findall(r'(?m)^const\s+(DEFAULT_[A-Z0-9_]+)', original))
              for name in names:
                  text = re.sub(rf'\b{re.escape(name)}\b', '[]', text)
              text = re.sub(r'(?ms)useState<([^>]+)>\(\(\)\s*=>\s*\{\s*const\s+saved\s*=\s*localStorage\.getItem\([^;]+;\s*return\s+saved\s*\?\s*JSON\.parse\(saved\)\s*:\s*\[\];\s*\}\)', r'useState<\1>([])', text)
              text = text.replace("user?.schoolSlug || 'demo'", "user?.schoolSlug || ''")
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','frontend/src'], check=True)
              subprocess.run(['git','diff','--cached','--check'], check=True)
              subprocess.run(['git','commit','-m','chore: remove remaining frontend seed data'], check=True)
              subprocess.run(['git','push','origin','HEAD:${{ github.head_ref }}'], check=True)
              print('Changed files:', *changed, sep='\n')
          else:
              print('No remaining DEFAULT_* arrays found')
