name: CI

on:
  push:
    branches: [main, fix/remove-dummy-data, feat/super-admin-market-ready]
  pull_request:
    branches: [main, feat/super-admin-market-ready]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: DATABASE_URL=postgresql://ci:ci@localhost:5432/edusphere NODE_ENV=production npm run validate:production-db
      - run: npm run lint:check
      - run: npm run build
      - run: npm run test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Fix known frontend lint blockers
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('frontend/src')

          # Attendance: define the loader before the effect that invokes it.
          p = root / 'pages/Attendance.tsx'
          s = p.read_text()
          s = re.sub(
              r"\n  useEffect\(\(\) => \{\n    if \(selectedClass\) \{\n      loadStudentsForClass\(selectedClass\);\n    \}\n  \}, \[selectedClass\]\);\n\n  const loadStudentsForClass",
              "\n  const loadStudentsForClass",
              s,
              count=1,
          )
          marker = "  };\n\n  const handleStatusChange"
          effect = "  };\n\n  useEffect(() => {\n    if (selectedClass) {\n      void loadStudentsForClass(selectedClass);\n    }\n  }, [selectedClass, selectedDate]);\n\n  const handleStatusChange"
          s = s.replace(marker, effect, 1)
          p.write_text(s)

          # Classes: empty catch blocks are invalid under no-empty.
          p = root / 'pages/Classes.tsx'
          s = p.read_text().replace('catch (_) {}', 'catch {}')
          p.write_text(s)

          # NoticeBoard/StudentLMS/Overview: replace unused ternary expressions with explicit control flow.
          replacements = {
              'pages/NoticeBoard.tsx': ("      silent ? setRefreshing(true) : setLoading(true);", "      if (silent) {\n        setRefreshing(true);\n      } else {\n        setLoading(true);\n      }"),
              'pages/StudentLMS.tsx': ("      silent ? setRefreshing(true) : setLoading(true);", "      if (silent) {\n        setRefreshing(true);\n      } else {\n        setLoading(true);\n      }"),
              'pages/SuperAdminDashboard/sections/Overview.tsx': ("      refresh ? setRefreshing(true) : setLoading(true);", "      if (refresh) {\n        setRefreshing(true);\n      } else {\n        setLoading(true);\n      }"),
          }
          for rel, (old, new) in replacements.items():
              p = root / rel
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected lint-fix target not found: {rel}')
              p.write_text(s.replace(old, new, 1))

          # StudentsLive: quotes inside regex literals do not need escaping.
          p = root / 'pages/StudentsLive.tsx'
          s = p.read_text().replace('\\"', '"')
          p.write_text(s)

          if subprocess.run(['git', 'diff', '--quiet'], cwd='.', check=False).returncode != 0:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'frontend/src/pages', 'frontend/src/components'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: resolve frontend lint errors'], check=True)
              subprocess.run(['git', 'push'], check=True)
      - run: npm run lint
      - run: npm run build
