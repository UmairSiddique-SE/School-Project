name: Remove Demo Data

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove frontend demo seed data
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('frontend/src')

          def strip_const(text, name):
              pat = re.compile(rf'(?m)^const\s+{re.escape(name)}\s*=')
              m = pat.search(text)
              while m:
                  start = m.start()
                  i = m.end()
                  depth = 0
                  quote = None
                  esc = False
                  while i < len(text):
                      c = text[i]
                      if quote:
                          if esc:
                              esc = False
                          elif c == '\\':
                              esc = True
                          elif c == quote:
                              quote = None
                      else:
                          if c in "'\"`":
                              quote = c
                          elif c in '[{(':
                              depth += 1
                          elif c in ']})':
                              depth = max(0, depth - 1)
                          elif c == ';' and depth == 0:
                              i += 1
                              break
                      i += 1
                  text = text[:start] + text[i:]
                  m = pat.search(text)
              return text

          changed = []
          for path in list(root.rglob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              original = text

              names = set(re.findall(r'(?m)^const\s+(DEFAULT_[A-Z0-9_]+)\s*=', text))
              for name in sorted(names):
                  text = strip_const(text, name)
                  text = re.sub(rf'\b{re.escape(name)}\b', '[]', text)

              # Remove frontend-only localStorage seed fallback blocks. Real records must
              # come from the backend/database rather than browser demo storage.
              text = re.sub(
                  r'useState<([^>]+)>\(\(\)\s*=>\s*\{\s*const\s+saved\s*=\s*localStorage\.getItem\([^;]+;\s*return\s+saved\s*\?\s*JSON\.parse\(saved\)\s*:\s*\[\];\s*\}\)',
                  lambda m: f'useState<{m.group(1)}>([])',
                  text,
                  flags=re.S,
              )

              # Remove the explicit demo reset action from Exams.
              text = re.sub(r'(?ms)^\s*// Reset Demo\s*\n.*?(?=^\s*// Calculate Student Cumulative Totals)', '\n', text)
              text = re.sub(r'(?ms)\n\s*<button\s+\n\s*onClick=\{handleResetDemo\}.*?</button>', '', text)
              text = text.replace("user?.schoolSlug || 'demo'", "user?.schoolSlug || ''")

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Remove legacy browser demo records for known module keys. Auth storage is untouched.
          app = Path('frontend/src/App.tsx')
          if app.exists():
              text = app.read_text(encoding='utf-8')
              marker = '// Legacy demo-data cleanup'
              if marker not in text:
                  effect = '''\n\n// Legacy demo-data cleanup\n// Removes records created by the old frontend-only demo implementation.\ntry {\n  if (typeof window !== 'undefined') {\n    const demoPrefixes = ['edusphere_exams_', 'edusphere_grades_', 'edusphere_timetable_', 'edusphere_homework_', 'edusphere_classes_', 'edusphere_notifications_', 'edusphere_students_', 'edusphere_finance_', 'edusphere_transport_', 'edusphere_attendance_', 'edusphere_notices_'];\n    for (let i = 0; i < localStorage.length; i += 1) {\n      const key = localStorage.key(i);\n      if (key && demoPrefixes.some(prefix => key.startsWith(prefix))) localStorage.removeItem(key);\n    }\n  }\n} catch {\n  // Ignore storage access errors.\n}\n'''
                  idx = text.find('export default')
                  if idx >= 0:
                      text = text[:idx] + effect + '\n' + text[idx:]
                      app.write_text(text, encoding='utf-8')
                      changed.append(str(app))

          print('Changed files:')
          for p in changed:
              print(p)
          if not changed:
              print('No changes needed')
