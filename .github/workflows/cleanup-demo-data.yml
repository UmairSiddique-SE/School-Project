name: Cleanup demo data

on:
  pull_request:
    types: [opened, synchronize]
    branches: [complete/flow-hardening]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove fabricated frontend data
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists(): return
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old: p.write_text(new, encoding='utf-8')

          def between(t, start, end):
              return re.sub(re.escape(start) + r'.*?' + re.escape(end), end, t, count=1, flags=re.S)

          def attendance(t):
              t = between(t, 'const MOCK_CLASSES:', '// ─── Main Component')
              t = t.replace("const schoolSlug = user?.schoolSlug || 'demo';", "const schoolSlug = user?.schoolSlug || '';")
              t = t.replace("useState<ClassSection[]>(MOCK_CLASSES)", "useState<ClassSection[]>([])")
              t = t.replace("useState<string>(sectionIdParam || 'sec-1')", "useState<string>(sectionIdParam || '')")
              t = t.replace("const studentsData = Array.isArray(res.data?.students) ? res.data.students : MOCK_STUDENTS.filter(s => s.sectionId === sectionId);", "const studentsData = Array.isArray(res.data?.students) ? res.data.students : [];")
              t = re.sub(r"    \} catch \(error\) \{\n      // Use mock data.*?\n      setAttendance\(initialAttendance\);\n    \} finally", "    } catch (error) {\n      setStudents([]);\n      setAttendance({});\n      toast.error('Unable to load attendance data. Please try again.');\n    } finally", t, flags=re.S)
              return t

          def finance(t):
              t = between(t, '// ─── Mock Data', '// ─── Main Component')
              t = t.replace("setPayments(Array.isArray(pRes.data) ? pRes.data : MOCK_PAYMENTS);", "setPayments(Array.isArray(pRes.data) ? pRes.data : []);")
              t = t.replace("setStructures(Array.isArray(sRes.data) ? sRes.data : MOCK_STRUCTURES);", "setStructures(Array.isArray(sRes.data) ? sRes.data : []);")
              t = t.replace("setStudents(Array.isArray(stRes.data) ? stRes.data : MOCK_STUDENTS);", "setStudents(Array.isArray(stRes.data) ? stRes.data : []);")
              t = t.replace("setPayments(MOCK_PAYMENTS);", "setPayments([]);").replace("setStructures(MOCK_STRUCTURES);", "setStructures([]);").replace("setStudents(MOCK_STUDENTS);", "setStudents([]);")
              t = t.replace("toast.error('Using demo data');", "toast.error('Unable to load finance data. Please try again.');")
              return t

          def transport(t):
              t = between(t, 'const MOCK_ROUTES:', 'export default function Transport')
              t = re.sub(r'MOCK_ASSIGNMENTS', '[]', t)
              t = re.sub(r'useState<TransportRoute\[\]>\(MOCK_[A-Z0-9_]+\)', 'useState<TransportRoute[]>([])', t)
              t = re.sub(r'useState<Vehicle\[\]>\(MOCK_[A-Z0-9_]+\)', 'useState<Vehicle[]>([])', t)
              t = re.sub(r'setRoutes\(MOCK_[A-Z0-9_]+\)', 'setRoutes([])', t)
              t = re.sub(r'setVehicles\(MOCK_[A-Z0-9_]+\)', 'setVehicles([])', t)
              return t

          def notices(t):
              t = between(t, 'const MOCK_NOTICES:', 'export default function NoticeBoard')
              t = re.sub(r'MOCK_[A-Z0-9_]+', '[]', t)
              t = t.replace("toast.error('Using demo data');", "toast.error('Unable to load notices. Please try again.');")
              return t

          def students(t):
              t = between(t, '  const MOCK_STUDENTS = [', '  const fetchAll = () => {')
              t = t.replace("setStudents(MOCK_STUDENTS);", "setStudents([]);").replace("setClasses(MOCK_CLASSES);", "setClasses([]);")
              t = t.replace("toast.success('Mock Excel parsed successfully: 12 students imported!');", "toast.error('Bulk import is not available until the import API is connected.');")
              t = t.replace("selectedStudent.religion || 'Islam'", "selectedStudent.religion || '—'")
              t = t.replace("selectedStudent.section?.class?.numeric || '10'", "selectedStudent.section?.class?.numeric || '—'")
              t = t.replace("selectedStudent.section?.class?.name || 'Class 10'", "selectedStudent.section?.class?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'A'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'Alpha'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.rollNo || '01'", "selectedStudent.rollNo || '—'").replace("selectedStudent.rollNo || '00'", "selectedStudent.rollNo || '—'")
              t = t.replace("selectedStudent.session || '2026-2027'", "selectedStudent.session || '—'")
              t = t.replace("selectedStudent.fatherName || 'Robert Mercer'", "selectedStudent.fatherName || '—'").replace("selectedStudent.motherName || 'Emma Mercer'", "selectedStudent.motherName || '—'")
              t = t.replace("selectedStudent.fatherOccupation || 'Service'", "selectedStudent.fatherOccupation || '—'").replace("selectedStudent.motherOccupation || 'Housewife'", "selectedStudent.motherOccupation || '—'")
              t = t.replace("selectedStudent.email || `${selectedStudent.admissionNo.toLowerCase()}@school.edu`", "selectedStudent.email || '—'")
              t = t.replace("{selectedStudent.admissionNo.toLowerCase()}_parent@school.edu", "—").replace("parent123", "—")
              t = t.replace("selectedStudent?.bloodGroup || 'O+'", "selectedStudent?.bloodGroup || '—'").replace("selectedStudent?.phone || '+1 555 456 7890'", "selectedStudent?.phone || '—'")
              t = t.replace("selectedStudent ? selectedStudent.name : 'Alex Mercer'", "selectedStudent ? selectedStudent.name : '—'")
              t = t.replace("selectedStudent ? selectedStudent.admissionNo : 'STD001'", "selectedStudent ? selectedStudent.admissionNo : '—'")
              t = t.replace("selectedStudent ? selectedStudent.rollNo : '01'", "selectedStudent ? selectedStudent.rollNo : '—'")
              t = t.replace("parentPassword: parentPassword || 'parent123'", "parentPassword: parentPassword || ''")
              return t

          edit('frontend/src/pages/Attendance.tsx', attendance)
          edit('frontend/src/pages/Finance.tsx', finance)
          edit('frontend/src/pages/Transport.tsx', transport)
          edit('frontend/src/pages/NoticeBoard.tsx', notices)
          edit('frontend/src/pages/Students.tsx', students)

          for p in Path('frontend/src/pages').glob('*.tsx'):
              text = p.read_text(encoding='utf-8')
              for token in ('MOCK_STUDENTS','MOCK_PAYMENTS','MOCK_STRUCTURES','MOCK_CLASSES','MOCK_ROUTES','MOCK_VEHICLES','MOCK_NOTICES','MOCK_ASSIGNMENTS'):
                  if token in text: raise SystemExit(f'Remaining demo constant: {p}:{token}')

      - name: Commit cleanup to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .cleanup-trigger .cleanup-trigger-2 2>/dev/null || true
          git add frontend/src/pages
          if git diff --cached --quiet; then echo "No cleanup changes detected"; exit 0; fi
          git commit -m "Remove frontend demo and mock data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
