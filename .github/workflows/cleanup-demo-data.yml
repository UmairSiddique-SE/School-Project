name: Clean demo data

on:
  push:
    branches:
      - complete/flow-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/flow-hardening

      - name: Remove mock and fallback data
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = transform(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # Attendance: API-only classes/students; never silently fall back to demo records.
          def attendance(t):
              t = re.sub(r"\nconst MOCK_CLASSES: ClassSection\[\] = \[.*?\];\n\nconst MOCK_STUDENTS: Student\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("const schoolSlug = user?.schoolSlug || 'demo';", "const schoolSlug = user?.schoolSlug || '';" )
              t = t.replace("useState<ClassSection[]>(MOCK_CLASSES)", "useState<ClassSection[]>([])")
              t = t.replace("useState<string>(sectionIdParam || 'sec-1')", "useState<string>(sectionIdParam || '')")
              t = t.replace("  useEffect(() => {\n    if (selectedClass) {\n      loadStudentsForClass(selectedClass);\n    }\n  }, [selectedClass]);", "  useEffect(() => {\n    apiClient.get('/classes').then(res => {\n      const mapped: ClassSection[] = (Array.isArray(res.data) ? res.data : []).flatMap((c: any) =>\n        (Array.isArray(c.sections) ? c.sections : []).map((s: any) => ({\n          id: s.id,\n          name: s.name,\n          classId: c.id,\n          className: c.name,\n          totalStudents: Array.isArray(s.students) ? s.students.length : 0,\n        }))\n      );\n      setClasses(mapped);\n      if (!selectedClass && mapped[0]?.id) setSelectedClass(mapped[0].id);\n    }).catch(() => {\n      setClasses([]);\n      toast.error('Unable to load classes. Please try again.');\n    });\n  }, []);\n\n  useEffect(() => {\n    if (selectedClass) loadStudentsForClass(selectedClass);\n  }, [selectedClass, selectedDate]);")
              t = t.replace("const studentsData = Array.isArray(res.data?.students) ? res.data.students : MOCK_STUDENTS.filter(s => s.sectionId === sectionId);", "const studentsData = Array.isArray(res.data?.students) ? res.data.students : [];")
              t = re.sub(r"    } catch \(error\) \{\n      // Use mock data.*?      setAttendance\(initialAttendance\);\n    \} finally", "    } catch (error) {\n      setStudents([]);\n      setAttendance({});\n      toast.error('Unable to load attendance data. Please try again.');\n    } finally", t, flags=re.S)
              return t
          edit('frontend/src/pages/Attendance.tsx', attendance)

          # Finance: API-only records; no fabricated payments, structures or students.
          def finance(t):
              t = re.sub(r"\n// ─── Mock Data ─────────────────────────────────────────────────────────────────\n.*?\n// ─── Main Component", "\n// ─── Main Component", t, flags=re.S)
              t = t.replace("setPayments(Array.isArray(pRes.data) ? pRes.data : MOCK_PAYMENTS);", "setPayments(Array.isArray(pRes.data) ? pRes.data : []);")
              t = t.replace("setStructures(Array.isArray(sRes.data) ? sRes.data : MOCK_STRUCTURES);", "setStructures(Array.isArray(sRes.data) ? sRes.data : []);")
              t = t.replace("setStudents(Array.isArray(stRes.data) ? stRes.data : MOCK_STUDENTS);", "setStudents(Array.isArray(stRes.data) ? stRes.data : []);")
              t = re.sub(r"    \} catch \(\) \{\n      setPayments\(MOCK_PAYMENTS\);\n      setStructures\(MOCK_STRUCTURES\);\n      setStudents\(MOCK_STUDENTS\);\n    \}", "    } catch (error) {\n      setPayments([]);\n      setStructures([]);\n      setStudents([]);\n      toast.error('Unable to load finance data. Please try again.');\n    }", t)
              t = t.replace("<p className=\"text-[10px] text-emerald-400 mt-1\">+{todayRevenue > 0 ? '12%' : '0%'} from yesterday</p>", "<p className=\"text-[10px] text-muted-foreground mt-1\">Collected today from recorded payments</p>")
              return t
          edit('frontend/src/pages/Finance.tsx', finance)

          # Transport: remove demo route/vehicle constants and any fallback to them.
          def transport(t):
              t = re.sub(r"\nconst MOCK_ROUTES: TransportRoute\[\] = \[.*?\];\n\nconst MOCK_VEHICLES: Vehicle\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = re.sub(r"useState<TransportRoute\[\]>\(MOCK_ROUTES\)", "useState<TransportRoute[]>([])", t)
              t = re.sub(r"useState<Vehicle\[\]>\(MOCK_VEHICLES\)", "useState<Vehicle[]>([])", t)
              t = re.sub(r"setRoutes\([^;]*MOCK_ROUTES[^;]*\);", "setRoutes([]);", t)
              t = re.sub(r"setVehicles\([^;]*MOCK_VEHICLES[^;]*\);", "setVehicles([]);", t)
              return t
          edit('frontend/src/pages/Transport.tsx', transport)

          # Notices: API-only notices.
          def notices(t):
              t = re.sub(r"\nconst MOCK_NOTICES: Notice\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("setNotices(Array.isArray(res.data) ? res.data : MOCK_NOTICES)", "setNotices(Array.isArray(res.data) ? res.data : [])")
              t = re.sub(r"setNotices\(MOCK_NOTICES\);", "setNotices([]);", t)
              return t
          edit('frontend/src/pages/NoticeBoard.tsx', notices)

          # Students: remove fabricated records and UI fallbacks; keep real API data only.
          def students(t):
              t = re.sub(r"\n  // Excel import mock state\n", "\n  // Excel import state\n", t)
              t = re.sub(r"\n  const MOCK_STUDENTS = \[.*?\n  \];\n\n  const MOCK_CLASSES = \[.*?\n  \];\n", "\n", t, flags=re.S)
              t = re.sub(r"setStudents\(MOCK_STUDENTS\);\n\s*setClasses\(MOCK_CLASSES\);", "setStudents([]);\n        setClasses([]);\n        toast.error('Unable to load student data. Please try again.');", t)
              t = t.replace("toast.success('Mock Excel parsed successfully: 12 students imported!');", "toast.error('Bulk import is not available until the import API is connected.');")
              t = re.sub(r"    setImporting\(true\);\n    setTimeout\(\(\) => \{.*?\n    \}, 1500\);", "    setImporting(true);\n    setImporting(false);\n    setShowImport(false);", t, flags=re.S)
              t = t.replace("students.filter(s => s.gender === 'MALE').length || Math.floor(students.length * 0.52)", "students.filter(s => s.gender === 'MALE').length")
              t = t.replace("students.filter(s => s.gender === 'FEMALE').length || Math.floor(students.length * 0.48)", "students.filter(s => s.gender === 'FEMALE').length")
              t = t.replace("<h4 className=\"text-2xl font-black text-emerald-400\">12</h4>", "<h4 className=\"text-2xl font-black text-emerald-400\">{students.filter(s => String(s.admissionDate || '').slice(0, 7) === new Date().toISOString().slice(0, 7)).length}</h4>")
              t = t.replace("s.section?.class?.name || 'Class 10'", "s.section?.class?.name || '—'")
              t = t.replace("s.section?.name || 'Alpha'", "s.section?.name || '—'")
              t = t.replace("s.status || 'Active Record'", "s.status || '—'")
              t = t.replace("selectedStudent.religion || 'Islam'", "selectedStudent.religion || '—'")
              t = t.replace("selectedStudent.section?.class?.numeric || '10'", "selectedStudent.section?.class?.numeric || '—'")
              t = t.replace("selectedStudent.section?.class?.name || 'Class 10'", "selectedStudent.section?.class?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'A'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'Alpha'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.rollNo || '01'", "selectedStudent.rollNo || '—'")
              t = t.replace("selectedStudent.rollNo || '00'", "selectedStudent.rollNo || '—'")
              t = t.replace("selectedStudent.session || '2026-2027'", "selectedStudent.session || '—'")
              t = t.replace("selectedStudent.fatherName || 'Robert Mercer'", "selectedStudent.fatherName || '—'")
              t = t.replace("selectedStudent.motherName || 'Emma Mercer'", "selectedStudent.motherName || '—'")
              t = t.replace("selectedStudent.fatherOccupation || 'Service'", "selectedStudent.fatherOccupation || '—'")
              t = t.replace("selectedStudent.motherOccupation || 'Housewife'", "selectedStudent.motherOccupation || '—'")
              t = t.replace("selectedStudent.email || `${selectedStudent.admissionNo.toLowerCase()}@school.edu`", "selectedStudent.email || '—'")
              t = t.replace("{selectedStudent.admissionNo.toLowerCase()}_parent@school.edu", "—")
              t = t.replace("parent123", "—")
              t = t.replace("selectedStudent ? selectedStudent.name : 'Alex Mercer'", "selectedStudent ? selectedStudent.name : '—'")
              t = t.replace("selectedStudent ? selectedStudent.admissionNo : 'STD001'", "selectedStudent ? selectedStudent.admissionNo : '—'")
              t = t.replace("selectedStudent ? selectedStudent.rollNo : '01'", "selectedStudent ? selectedStudent.rollNo : '—'")
              t = t.replace("selectedStudent?.bloodGroup || 'O+'", "selectedStudent?.bloodGroup || '—'")
              t = t.replace("selectedStudent?.phone || '+1 555 456 7890'", "selectedStudent?.phone || '—'")
              t = re.sub(r"<span className=\"text-xs font-black text-emerald-400 uppercase tracking-widest\">96\.5% Net Attendance</span>", "<span className=\"text-xs font-black text-emerald-400 uppercase tracking-widest\">No attendance summary</span>", t)
              t = re.sub(r"<p className=\"text-6xl font-black text-emerald-400[^>]*>182</p>", "<p className=\"text-4xl font-black text-emerald-400\">—</p>", t)
              t = re.sub(r"<p className=\"text-6xl font-black text-rose-500[^>]*>05</p>", "<p className=\"text-4xl font-black text-rose-500\">—</p>", t)
              t = re.sub(r"<p className=\"text-6xl font-black text-amber-500[^>]*>02</p>", "<p className=\"text-4xl font-black text-amber-500\">—</p>", t)
              t = t.replace("Attendance verification is synchronized in real-time. Daily automated SMS and Push notifications are broadcasted to registered parent devices at 09:30 AM PST.", "Attendance details are shown from recorded system data when available.")
              # Replace hardcoded fee/results/homework blocks with honest empty states.
              t = re.sub(r"<div className=\"space-y-4\">\n\s*\{\[\n\s*\{ title: 'First Term Tuition Fee'.*?</div>\n\s*</div>\n\s*</motion.div>", "<div className=\"p-8 rounded-3xl border border-dashed border-white/10 text-center text-sm text-slate-500\">No financial records available for this student.</div>\n                      </motion.div>", t, flags=re.S)
              t = re.sub(r"<div className=\"grid grid-cols-1 md:grid-cols-2 gap-8\">\n\s*\{\[\n\s*\{ exam: 'Midterm Exam 2026'.*?</div>\n\s*</motion.div>", "<div className=\"p-8 rounded-3xl border border-dashed border-white/10 text-center text-sm text-slate-500\">No examination results available for this student.</div>\n                      </motion.div>", t, flags=re.S)
              t = re.sub(r"<div className=\"space-y-4\">\n\s*\{\[\n\s*\{ title: 'Linear Equation Chapter 3 Exercises'.*?</div>\n\s*</motion.div>", "<div className=\"p-8 rounded-3xl border border-dashed border-white/10 text-center text-sm text-slate-500\">No homework records available for this student.</div>\n                      </motion.div>", t, flags=re.S)
              t = re.sub(r"<div className=\"relative pl-12 border-l-2 border-white/\[0\.06\] space-y-12\">\n\s*\{\[\n\s*\{ event: 'Fee Invoice FP-8927 Cleared'.*?</div>\n\s*</motion.div>", "<div className=\"p-8 rounded-3xl border border-dashed border-white/10 text-center text-sm text-slate-500\">No timeline events available for this student.</div>\n                      </motion.div>", t, flags=re.S)
              return t
          edit('frontend/src/pages/Students.tsx', students)

          # Parent portal is intentionally removed from the product; delete the unused page if present.
          parent_page = Path('frontend/src/pages/Parents.tsx')
          if parent_page.exists():
              parent_page.unlink()

          # Keep the legitimate MOCK_BOARD exam type; fail the job if fabricated data constants remain.
          forbidden = []
          for path in Path('frontend/src/pages').glob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              for token in ('MOCK_STUDENTS', 'MOCK_PAYMENTS', 'MOCK_STRUCTURES', 'MOCK_CLASSES', 'MOCK_ROUTES', 'MOCK_VEHICLES', 'MOCK_NOTICES'):
                  if token in text:
                      forbidden.append(f'{path}:{token}')
          if forbidden:
              raise SystemExit('Remaining demo constants: ' + ', '.join(forbidden))

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git commit -m "Remove frontend demo and mock data"
          git push origin complete/flow-hardening
