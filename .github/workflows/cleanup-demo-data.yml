name: Cleanup demo data

on:
  pull_request:
    types: [opened, synchronize]
    branches: [complete/flow-hardening]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove fabricated frontend data
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          def attendance(t):
              t = re.sub(r"\nconst MOCK_CLASSES: ClassSection\[\] = \[.*?\];\n\nconst MOCK_STUDENTS: Student\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("const schoolSlug = user?.schoolSlug || 'demo';", "const schoolSlug = user?.schoolSlug || '';")
              t = t.replace("useState<ClassSection[]>(MOCK_CLASSES)", "useState<ClassSection[]>([])")
              t = t.replace("useState<string>(sectionIdParam || 'sec-1')", "useState<string>(sectionIdParam || '')")
              t = t.replace("const studentsData = Array.isArray(res.data?.students) ? res.data.students : MOCK_STUDENTS.filter(s => s.sectionId === sectionId);", "const studentsData = Array.isArray(res.data?.students) ? res.data.students : [];")
              t = re.sub(r"    \} catch \(error\) \{\n      // Use mock data.*?\n      setAttendance\(initialAttendance\);\n    \} finally", "    } catch (error) {\n      setStudents([]);\n      setAttendance({});\n      toast.error('Unable to load attendance data. Please try again.');\n    } finally", t, flags=re.S)
              return t

          def finance(t):
              t = re.sub(r"\nconst MOCK_PAYMENTS: FeePayment\[\] = \[.*?\];\n\nconst MOCK_STRUCTURES:.*?\];\n\nconst MOCK_STUDENTS: Student\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("setPayments(Array.isArray(pRes.data) ? pRes.data : MOCK_PAYMENTS);", "setPayments(Array.isArray(pRes.data) ? pRes.data : []);")
              t = t.replace("setStructures(Array.isArray(sRes.data) ? sRes.data : MOCK_STRUCTURES);", "setStructures(Array.isArray(sRes.data) ? sRes.data : []);")
              t = t.replace("setStudents(Array.isArray(stRes.data) ? stRes.data : MOCK_STUDENTS);", "setStudents(Array.isArray(stRes.data) ? stRes.data : []);")
              t = re.sub(r"    \} catch \(\) \{.*?\n    \}", "    } catch (error) {\n      setPayments([]);\n      setStructures([]);\n      setStudents([]);\n      toast.error('Unable to load finance data. Please try again.');\n    }", t, count=1, flags=re.S)
              t = re.sub(r"\+\{todayRevenue[^\n]*\}", "", t)
              return t

          def transport(t):
              t = re.sub(r"\nconst MOCK_ROUTES: TransportRoute\[\] = \[.*?\];\n\nconst MOCK_VEHICLES: Vehicle\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("useState<TransportRoute[]>(MOCK_ROUTES)", "useState<TransportRoute[]>([])")
              t = t.replace("useState<Vehicle[]>(MOCK_VEHICLES)", "useState<Vehicle[]>([])")
              t = t.replace("setRoutes(MOCK_ROUTES)", "setRoutes([])").replace("setVehicles(MOCK_VEHICLES)", "setVehicles([])")
              return t

          def notices(t):
              t = re.sub(r"\nconst MOCK_NOTICES: Notice\[\] = \[.*?\];\n", "\n", t, flags=re.S)
              t = t.replace("setNotices(Array.isArray(res.data) ? res.data : MOCK_NOTICES)", "setNotices(Array.isArray(res.data) ? res.data : [])")
              t = t.replace("setNotices(MOCK_NOTICES);", "setNotices([]);")
              return t

          def students(t):
              t = re.sub(r"\n  const MOCK_STUDENTS = \[.*?\n  \];\n\n  const MOCK_CLASSES = \[.*?\n  \];\n", "\n", t, flags=re.S)
              t = t.replace("setStudents(MOCK_STUDENTS);", "setStudents([]);")
              t = t.replace("setClasses(MOCK_CLASSES);", "setClasses([]);")
              t = t.replace("toast.success('Mock Excel parsed successfully: 12 students imported!');", "toast.error('Bulk import is not available until the import API is connected.');")
              t = re.sub(r"    setImporting\(true\);\n    setTimeout\(\(\) => \{.*?\n    \}, 1500\);", "    setImporting(true);\n    setImporting(false);\n    setShowImport(false);", t, flags=re.S)
              t = t.replace("students.filter(s => s.gender === 'MALE').length || Math.floor(students.length * 0.52)", "students.filter(s => s.gender === 'MALE').length")
              t = t.replace("students.filter(s => s.gender === 'FEMALE').length || Math.floor(students.length * 0.48)", "students.filter(s => s.gender === 'FEMALE').length")
              t = t.replace("{s.section?.class?.name || 'Class 10'}", "{s.section?.class?.name || '—'}")
              t = t.replace("{s.section?.name || 'Alpha'}", "{s.section?.name || '—'}")
              t = t.replace("{s.status || 'Active Record'}", "{s.status || '—'}")
              t = t.replace("selectedStudent.religion || 'Islam'", "selectedStudent.religion || '—'")
              t = t.replace("selectedStudent.section?.class?.numeric || '10'", "selectedStudent.section?.class?.numeric || '—'")
              t = t.replace("selectedStudent.section?.class?.name || 'Class 10'", "selectedStudent.section?.class?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'A'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.section?.name || 'Alpha'", "selectedStudent.section?.name || '—'")
              t = t.replace("selectedStudent.rollNo || '01'", "selectedStudent.rollNo || '—'")
              t = t.replace("selectedStudent.rollNo || '00'", "selectedStudent.rollNo || '—'")
              t = t.replace("selectedStudent.session || '2026-2027'", "selectedStudent.session || '—'")
              t = t.replace("selectedStudent.fatherName || 'Robert Mercer'", "selectedStudent.fatherName || '—'")
              t = t.replace("selectedStudent.motherName || 'Emma Mercer'", "selectedStudent.motherName || '—'")
              t = t.replace("selectedStudent.fatherOccupation || 'Service'", "selectedStudent.fatherOccupation || '—'")
              t = t.replace("selectedStudent.motherOccupation || 'Housewife'", "selectedStudent.motherOccupation || '—'")
              t = t.replace("selectedStudent.email || `${selectedStudent.admissionNo.toLowerCase()}@school.edu`", "selectedStudent.email || '—'")
              t = t.replace("{selectedStudent.admissionNo.toLowerCase()}_parent@school.edu", "—")
              t = t.replace("parent123", "—")
              t = t.replace("selectedStudent?.bloodGroup || 'O+'", "selectedStudent?.bloodGroup || '—'")
              t = t.replace("selectedStudent?.phone || '+1 555 456 7890'", "selectedStudent?.phone || '—'")
              t = t.replace("selectedStudent ? selectedStudent.name : 'Alex Mercer'", "selectedStudent ? selectedStudent.name : '—'")
              t = t.replace("selectedStudent ? selectedStudent.admissionNo : 'STD001'", "selectedStudent ? selectedStudent.admissionNo : '—'")
              t = t.replace("selectedStudent ? selectedStudent.rollNo : '01'", "selectedStudent ? selectedStudent.rollNo : '—'")
              return t

          edit('frontend/src/pages/Attendance.tsx', attendance)
          edit('frontend/src/pages/Finance.tsx', finance)
          edit('frontend/src/pages/Transport.tsx', transport)
          edit('frontend/src/pages/NoticeBoard.tsx', notices)
          edit('frontend/src/pages/Students.tsx', students)

          parent = Path('frontend/src/pages/Parents.tsx')
          if parent.exists():
              parent.unlink()

          forbidden = []
          for p in Path('frontend/src/pages').glob('*.tsx'):
              text = p.read_text(encoding='utf-8')
              for token in ('MOCK_STUDENTS','MOCK_PAYMENTS','MOCK_STRUCTURES','MOCK_CLASSES','MOCK_ROUTES','MOCK_VEHICLES','MOCK_NOTICES'):
                  if token in text:
                      forbidden.append(f'{p}:{token}')
          if forbidden:
              raise SystemExit('Remaining demo constants: ' + ', '.join(forbidden))

      - name: Commit cleanup to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages
          if git diff --cached --quiet; then
            echo "No cleanup changes detected"
            exit 0
          fi
          git commit -m "Remove frontend demo and mock data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
