name: Debug Frontend Lint
on:
  push:
    branches: [feat/super-admin-market-ready]
jobs:
  lint-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Capture lint output
        working-directory: frontend
        run: |
          npm run lint > lint-output.txt 2>&1 || true
          cat lint-output.txt
      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-output
          path: frontend/lint-output.txt
