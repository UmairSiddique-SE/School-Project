name: Fix onboarding login flow

on:
  push:
    branches: [feat/super-admin-market-ready]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: finalize onboarding login flow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/super-admin-market-ready
          fetch-depth: 0

      - name: Patch onboarding auth flow
        shell: python
        run: |
          from pathlib import Path
          import re

          auth = Path('backend/src/modules/auth/auth.service.ts')
          text = auth.read_text(encoding='utf-8')

          old = """    if (!user.isActive)\n      throw new UnauthorizedException('This account has been suspended');\n    if (user.school && !user.school.isActive)\n      throw new UnauthorizedException('This school account is suspended');\n    if (user.role === 'SCHOOL_ADMIN' && user.school) {\n      const pendingRequest = await this.prisma.schoolRequest.findFirst({\n        where: { email: user.email, status: 'PENDING' },\n        select: { id: true },\n      });\n      if (pendingRequest)\n        throw new UnauthorizedException(\n          'Your school registration is pending Super Admin approval. School login will be enabled after approval.',\n        );\n    }\n"""
          new = """    const pendingRequest =\n      user.role === 'SCHOOL_ADMIN' && user.school\n        ? await this.prisma.schoolRequest.findFirst({\n            where: { email: user.email, status: 'PENDING' },\n            select: { id: true },\n          })\n        : null;\n\n    // Pending school admins must be able to sign in so onboarding/payment\n    // can continue. Portal access remains locked by activationStatus/guards.\n    if (!user.isActive && !pendingRequest)\n      throw new UnauthorizedException('This account has been suspended');\n    if (user.school && !user.school.isActive && !pendingRequest)\n      throw new UnauthorizedException('This school account is suspended');\n"""
          if old not in text:
              raise SystemExit('login block not found')
          text = text.replace(old, new, 1)

          old = """    if (\n      !stored.user.isActive ||\n      (stored.user.school && (!stored.user.school.isActive || expired))\n    )\n      throw new UnauthorizedException('Account or subscription is inactive');\n    if (stored.user.role === 'SCHOOL_ADMIN' && stored.user.schoolId) {\n      const pendingRequest = await this.prisma.schoolRequest.findFirst({\n        where: { email: stored.user.email, status: 'PENDING' },\n        select: { id: true },\n      });\n      if (pendingRequest)\n        throw new UnauthorizedException(\n          'School registration is still pending Super Admin approval',\n        );\n    }\n"""
          new = """    const pendingRequest =\n      stored.user.role === 'SCHOOL_ADMIN' && stored.user.schoolId\n        ? await this.prisma.schoolRequest.findFirst({\n            where: { email: stored.user.email, status: 'PENDING' },\n            select: { id: true },\n          })\n        : null;\n    const inactiveAccount = !stored.user.isActive;\n    const inactiveSchool = Boolean(\n      stored.user.school && !stored.user.school.isActive,\n    );\n    if ((inactiveAccount || inactiveSchool) && !pendingRequest)\n      throw new UnauthorizedException('Account or subscription is inactive');\n    if (expired)\n      throw new UnauthorizedException('Account or subscription is inactive');\n"""
          if old not in text:
              raise SystemExit('refresh block not found')
          text = text.replace(old, new, 1)
          auth.write_text(text, encoding='utf-8')

          reg = Path('frontend/src/pages/RegisterSchool.tsx')
          text = reg.read_text(encoding='utf-8')
          text2 = re.sub(r"setApprovalRef\(ref\);\s*logout\(\);\s*setFlowStep\(\"pending\"\);", "setApprovalRef(ref); setFlowStep(\"pending\");", text, count=1)
          if text2 == text:
              raise SystemExit('paid payment logout block not found')
          reg.write_text(text2, encoding='utf-8')

          layout = Path('frontend/src/layouts/AuthLayout.tsx')
          text = layout.read_text(encoding='utf-8')
          old = """  // If already authenticated, redirect straight to dashboard\n  if (isAuthenticated) {\n    const destination = user?.role === 'SUPER_ADMIN'\n      ? '/platform/super-admin'\n      : `/${schoolSlug || user?.schoolSlug || 'demo'}/dashboard`;\n    return <Navigate to={destination} replace />;\n  }\n\n"""
          new = """  // Keep the login route reachable even when an old/stale session exists.\n  // The actual login action decides where the user goes after credentials are verified.\n\n"""
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace("import { Outlet, Navigate, useParams } from 'react-router-dom';", "import { Outlet } from 'react-router-dom';", 1)
          text = text.replace("import { useAuth } from '@/context/AuthContext';\n", "", 1)
          text = text.replace("  const { isAuthenticated, user } = useAuth();\n  const { schoolSlug } = useParams();\n\n", "", 1)
          layout.write_text(text, encoding='utf-8')

      - name: Verify TypeScript builds
        run: |
          cd backend
          npm ci
          npx tsc --noEmit
          cd ../frontend
          npm ci
          npm run build

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/auth/auth.service.ts frontend/src/pages/RegisterSchool.tsx frontend/src/layouts/AuthLayout.tsx
          git rm .github/workflows/fix-onboarding-login.yml
          git commit -m "fix: finalize onboarding login flow"
          git push origin feat/super-admin-market-ready
