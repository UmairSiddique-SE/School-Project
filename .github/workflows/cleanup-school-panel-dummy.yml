name: Check School Panel Dummy Data

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on leftover mock fixtures
        shell: python
        run: |
          from pathlib import Path

          forbidden = (
              'MOCK_STUDENTS', 'MOCK_CLASSES', 'MOCK_TEACHER_CLASSES',
              'MOCK_ROUTES', 'MOCK_VEHICLES', 'Robert Mercer', 'Alex Mercer',
              "parent123",
          )
          root = Path('frontend/src/pages')
          offenders = []
          for path in root.rglob('*.tsx'):
              text = path.read_text(encoding='utf-8-sig', errors='ignore')
              for token in forbidden:
                  if token in text:
                      offenders.append(f'{path}: {token}')
          if offenders:
              print('Mock fixture markers found:')
              print('\n'.join(offenders))
              raise SystemExit(1)
          print('No mock fixture markers found.')
