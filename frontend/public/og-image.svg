<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="45%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="280" fill="#0284c7" opacity="0.18" filter="url(#ogGlow)"/>
  <circle cx="1000" cy="450" r="320" fill="#7c3aed" opacity="0.15" filter="url(#ogGlow)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(100, 85)">
    <rect width="270" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#7dd3fc" letter-spacing="2">NEXT-GEN SCHOOL ERP SAAS</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    EduSphere Pro ERP
  </text>
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" letter-spacing="-0.5">
    Multi-Campus Intelligence
  </text>

  <!-- Tagline / Description -->
  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Academics, automated fee billing, parent & student portals, and complete campus control.
  </text>
  <text x="100" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Engineered for excellence with dedicated custom links for every institution.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 450)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">⚡ 100% Cloud Synced</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="240" height="52" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="264" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">🏫 Dedicated School Web</text>

    <!-- Pill 3 -->
    <rect x="500" y="0" width="220" height="52" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="524" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">💳 Automated Finance</text>
  </g>

  <!-- Giant Aesthetic Brand Crest Icon on Right -->
  <g transform="translate(860, 160)">
    <rect width="240" height="240" rx="60" fill="url(#ogBg)" stroke="url(#brandGrad)" stroke-width="3" filter="url(#ogGlow)" opacity="0.9"/>
    <circle cx="120" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <path d="M 75 69 C 75 63 80 59 86 59 L 160 59 C 166 59 171 64 171 70 C 171 76 166 81 160 81 L 97 81 L 97 105 L 147 105 C 153 105 158 110 158 116 C 158 122 153 127 147 127 L 97 127 L 97 165 L 163 165 C 169 165 174 170 174 176 C 174 182 169 187 163 187 L 86 187 C 80 187 75 182 75 176 Z" fill="url(#brandGrad)"/>
    <polygon points="173,50 193,61 173,72 153,61" fill="#38bdf8"/>
    <circle cx="193" cy="61" r="3" fill="#ffffff"/>
    <circle cx="165" cy="116" r="5" fill="#38bdf8"/>
  </g>

  <!-- URL Footer -->
  <text x="100" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">
    https://school-managment-pro.vercel.app
  </text>
  <text x="1100" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="end">
    Verified Enterprise SaaS Platform
  </text>
</svg>

