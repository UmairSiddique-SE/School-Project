<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#02060e"/>
    </linearGradient>

    <!-- Main Tech Gradient: Vivid Cyan to Royal Blue to Indigo -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Cap & Gold Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Smooth Squircle Icon Canvas -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle Concentric Orbit Guide Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Core Glow Atmosphere -->
  <circle cx="256" cy="256" r="100" fill="url(#brandGrad)" opacity="0.22" filter="url(#softGlow)"/>

  <!-- ── Master Brand Mark: Graduation Cap + Monogram Shield ── -->
  <g transform="translate(0, 8)">
    <!-- Graduation Cap Top Diamond Rhombus -->
    <polygon points="256,120 380,182 256,244 132,182" fill="url(#brandGrad)" filter="url(#softGlow)"/>
    <polygon points="256,128 368,182 256,236 144,182" fill="#0f2647" opacity="0.4"/>

    <!-- Mortarboard Cap Skull-cap arc base -->
    <path d="M 180 206 L 180 262 C 180 300 332 300 332 262 L 332 206 C 308 220 282 228 256 228 C 230 228 204 220 180 206 Z"
          fill="url(#brandGrad)" opacity="0.95"/>

    <!-- Tassel Ribbon & Bobble Bead -->
    <path d="M 380 182 Q 402 216 394 280" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="394" cy="286" r="8" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="394" cy="286" r="4" fill="#ffffff"/>

    <!-- Modern Open Book / Digital Wings Base -->
    <g transform="translate(256, 345)">
      <!-- Left Page Curve -->
      <path d="M -8 18 C -50 0 -105 12 -135 34 C -135 12 -85 -6 -8 6 Z"
            fill="url(#brandGrad)" filter="url(#softGlow)"/>
      <!-- Right Page Curve -->
      <path d="M 8 18 C 50 0 105 12 135 34 C 135 12 85 -6 8 6 Z"
            fill="url(#brandGrad)" filter="url(#softGlow)"/>
      <!-- Spine Star Sparkle -->
      <circle cx="0" cy="12" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="0" cy="12" r="2.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
