<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071220"/>
      <stop offset="50%" stop-color="#0c1f36"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle Decorative Ambient Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.1"/>

  <!-- Floating Glowing Core Glow -->
  <circle cx="256" cy="256" r="110" fill="url(#primaryGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Modern Geometric "E" Crest with Graduation Cap & Tech Node -->
  <!-- Top Bar of E (Wings / Cap) -->
  <path d="M 160 148 C 160 136 170 128 182 128 L 330 128 C 342 128 352 138 352 150 C 352 162 342 172 330 172 L 204 172 L 204 220 L 304 220 C 316 220 326 230 326 242 C 326 254 316 264 304 264 L 204 264 L 204 340 L 336 340 C 348 340 358 350 358 362 C 358 374 348 384 336 384 L 182 384 C 170 384 160 374 160 362 Z"
        fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Academic Diamond Crest on Top Right -->
  <polygon points="356,110 396,132 356,154 316,132" fill="#38bdf8"/>
  <circle cx="396" cy="132" r="5" fill="#ffffff"/>

  <!-- Golden Orbit Accent Dot -->
  <circle cx="340" cy="242" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="340" cy="242" r="4" fill="#ffffff"/>
  <circle cx="372" cy="362" r="8" fill="#a855f7" filter="url(#glow)"/>
</svg>

